version: "3.8"

services:
  app:
    build:
      context: .
      args:
        REACT_APP_GOOGLE_MAPS_APIKEY: ${REACT_APP_GOOGLE_MAPS_APIKEY}
    env_file: .env
    restart: unless-stopped
    expose:
      - "6000"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
